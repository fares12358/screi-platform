name: Deploy to GitHub Pages

on:
  # Run on every push to the main branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required by the Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; skip queued runs but do not cancel in-progress ones
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Reads the Pages settings for this repository and exposes the
      # base_path output (e.g. "/screi-platform" for a project site).
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Pass the repository sub-path so Vite prefixes all asset URLs correctly.
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      # Upload the dist/ folder as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
